    <script>
      /* Proteção contra extensões de navegador que tentam sobrescrever window.fetch em propriedades com apenas getter */
      try {
        let _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return _currentFetch;
          },
          set(newFetch) {
            _currentFetch = newFetch;
          }
        });
      } catch (err) {
        /* Silencioso caso já esteja definido ou restrito */
      }

      /* Evita que erros originados em chrome-extension:// quebrem a aplicação */
      window.addEventListener('error', function(event) {
        if (event && (event.filename?.includes('chrome-extension://') || event.message?.includes('Cannot set property fetch'))) {
          event.stopImmediatePropagation?.();
          event.preventDefault?.();
          return true;
        }
      }, true);
    </script>
